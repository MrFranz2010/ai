services:
  - type: web
    name: nokk-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python render_start.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_USERNAME
        value: nokk
      - key: APP_PASSWORD
        sync: false
