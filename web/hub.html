<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#191817">
  <meta name="mobile-web-app-capable" content="yes">
  <title>NOKK · Hub</title>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("nokk-theme") === "light" ? "light" : "dark";
      document.querySelector('meta[name="theme-color"]').content =
        document.documentElement.dataset.theme === "light" ? "#f4f8fa" : "#191817";
      const rotation = localStorage.getItem("nokk-hub-rotation");
      if (["0", "90", "180", "270"].includes(rotation) && rotation !== "0") {
        document.documentElement.dataset.rotation = rotation;
      }
    } catch (error) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/hub.css">
  <script src="/hub.js" defer></script>
</head>
<body>
  <div class="hub-top">
    <p class="hub-brand"><span class="hub-dot" aria-hidden="true"></span>NOKK HUB</p>
    <p class="hub-connection" id="connection" role="status">pronto</p>
    <div class="hub-actions">
      <button class="hub-icon-button" id="rotate-button" type="button" aria-label="Ruota la schermata (0°)" title="Ruota la schermata (0°)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3.4-7"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="hub-icon-button" id="fullscreen-button" type="button" aria-label="Schermo intero" title="Schermo intero">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M16 21h3a2 2 0 0 0 2-2v-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
      </button>
      <button class="hub-icon-button" id="settings-button" type="button" aria-label="Impostazioni hub" title="Impostazioni hub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <main class="hub-grid">
    <aside class="hub-rail" id="rail-left" aria-label="Widget a sinistra"></aside>

    <section class="hub-center" aria-label="Parla con NOKK">
      <button class="ptt" id="ptt" type="button" data-state="idle">
        <svg class="ptt-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 11v1a7 7 0 0 1-14 0v-1"/><path d="M12 19v3M8 22h8"/></svg>
        <span class="ptt-label">Parla</span>
      </button>
      <p class="ptt-hint" id="ptt-hint">Tieni premuto e parla</p>
      <p class="hub-transcript" id="transcript" aria-live="polite"></p>
      <div class="hub-reply" id="reply" aria-live="polite"></div>
    </section>

    <aside class="hub-rail" id="rail-right" aria-label="Widget a destra"></aside>
  </main>

  <audio id="player" preload="none"></audio>

  <div class="hub-settings-backdrop" id="settings" hidden>
    <section class="hub-settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="hub-settings-header">
        <h2 id="settings-title">Impostazioni hub</h2>
        <button class="hub-icon-button" id="settings-close" type="button" aria-label="Chiudi impostazioni">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <div class="hub-settings-section">
        <h3>Widget</h3>
        <p class="hub-settings-note">Scegli cosa mostrare, su quale lato e in che ordine.</p>
        <div class="widget-list" id="widget-list"></div>
      </div>

      <div class="hub-settings-section">
        <h3>In riproduzione</h3>
        <p class="hub-settings-note">Un flusso audio diretto (radio o Music Assistant) riprodotto dal telefono.</p>
        <label class="hub-settings-field">Indirizzo del flusso
          <input id="stream-url" type="url" inputmode="url" placeholder="https://…" autocomplete="off">
        </label>
        <label class="hub-settings-field">Nome del flusso
          <input id="stream-name" type="text" maxlength="60" placeholder="Radio o Music Assistant" autocomplete="off">
        </label>
      </div>

      <div class="hub-settings-section">
        <h3>Aspetto</h3>
        <label class="hub-settings-field">Tema
          <select id="theme-select">
            <option value="dark">Scuro</option>
            <option value="light">Chiaro</option>
          </select>
        </label>
        <label class="hub-settings-toggle">
          <input id="speak-replies" type="checkbox">
          Leggi le risposte ad alta voce
        </label>
      </div>

      <p class="hub-settings-note">Le impostazioni restano su questo dispositivo.</p>
    </section>
  </div>
</body>
</html>
